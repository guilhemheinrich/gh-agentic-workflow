x-bundle-descriptions:
  common: Stack-agnostic minimum-viable starter set for any project
x-category-descriptions:
  architecture: 'Cross-cutting architectural invariants: hexagonal/DDD, monorepo,
    vertical slices, Makefile structure'
  standards: Project-wide coding/documentation standards (pure domain, indexing-friendly
    docs)
  programming-languages: Language-level rules and skills (TypeScript, Python, FP-TS
    conventions)
  frameworks-and-libraries: Framework- or library-scoped rules and skills (NestJS,
    Lit, Vitest, Nuxt, React)
  tools-and-configurations: 'Tooling and configuration: Docker, Git, npm, semantic
    commits, Bitbucket, k8s'
  workflows-and-processes: Process and workflow rules (spec-driven dev, indexing,
    release workflows)
  templates-and-models: Reusable templates and reference models
  quality-assurance: Testing, verification, accessibility, performance, security audits,
    UI verification
  domain-specific: Business-domain-bound rules (Hub, Keycloak, real-estate)
  other: Anything that genuinely does not fit above (escape hatch; use sparingly)
