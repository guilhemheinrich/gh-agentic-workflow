x-plugin-descriptions:
  agent-sessions: >-
    Run and steer agent sessions: pilot sessions, session titles, conversation focus hooks, PR and tracker watching,
    grievances, usage tracking.
  review-and-projection: Adversarial multi-model review and pre-implementation projections of a change onto files and data.
  agent-tooling: >-
    Tooling for building and maintaining agent setups: plugin release, static-validation hooks, LSP over MCP, ESLint
    standards for NestJS.
  docker-and-k8s: >-
    Containers and clusters: Dockerfile patterns, hot-reload volumes, Compose port management, Kubernetes
    troubleshooting, private npm registries in images.
  git-and-delivery: >-
    Git workflows and delivery pipelines: commits, merges, activity reports, CI/CD design, semantic-release, Makefile
    conventions, SonarQube, version surfaces.
  testing-and-debugging: >-
    Testing and investigation: Playwright end-to-end suites, auth fixtures, per-environment test targeting, web
    analysis, scraping, debugging.
  backend-and-data: >-
    Backend and data practices: SQL migrations, pg-boss with Drizzle, data-first philosophy, OpenAPI client generation,
    API collection conversion, MCP spec templates.
  frontend: >-
    Frontend building blocks: Lit web components, cursor glow canvas effect, text clip effects, live Web Component demos
    in Starlight.
  modelo-internal: >-
    Private, never published: Modelo-specific Hub registration, Keycloak user registration, tenant/agency/user database
    model and environment setup.
  speckit: >-
    Spec-driven development on top of GitHub Spec Kit (requires spec-kit installed): orchestration agents,
    specify/plan/tasks pipeline, spec indexing, E2E specs, Notion sync.
assets:
  - path: .cursor/commands/k8s-troubleshoot.md
    type: command
    tags:
      - devops
      - infrastructure
      - kubernetes
    description: >-
      Diagnose and resolve Kubernetes infrastructure issues. Identifies pod errors, applies in-scope fixes (ConfigMap,
      rollout), and generates DevOps reports for out-of-scope problems. All kubectl commands run inside Docker.
    category: tools-and-configurations
    plugin: docker-and-k8s
  - path: .cursor/commands/spt.md
    type: command
    tags:
      - cursor
      - spec-kit
    description: Run the full Specify → Plan → Tasks pipeline in one shot, pausing if any step requires user input.
    category: workflows-and-processes
    plugin: speckit
  - path: .cursor/rules/0-rules-structure.mdc
    type: rule
    tags:
      - cursor
      - meta
      - rules
    description: >-
      Conventions for the rules/ tree: category folders, .mdc naming, required frontmatter, and how globs scope each
      rule. Apply when creating or moving rules.
    category: architecture
  - path: agents/archivist.md
    type: agent
    tags:
      - documentation
      - spec-kit
    description: >-
      Manages the project knowledge graph at memory/ (repo root): recall (inject tactical/strategic constraints at phase
      start) and learn (extract insights after merge). ALWAYS uses /speckit.memory command for the structured digest.
      Deduplicates rules; updates operational/tactical/strategic scopes.
    category: workflows-and-processes
    plugin: speckit
  - path: agents/cartographer.md
    type: agent
    tags:
      - spec-kit
    description: >-
      Roadmap and feature planning agent. Delegates to this agent when the user needs to plan a roadmap, break down a
      project into features, prioritize work, or scope a phase of development. Runs /specify with a phase-level
      perspective. Use proactively when a project needs strategic planning before individual feature specification.
      Requires Opus 4.6 Max Thinking for deep strategic reasoning and critical analysis.
    category: workflows-and-processes
    plugin: speckit
  - path: agents/commiter.md
    type: agent
    tags:
      - git
      - github
    description: >-
      Handles everyday Git workflows: analyzes all pending changes, groups them into logical batches, and commits each
      with a semantic conventional message. Manages merge across the branch hierarchy (develop → staging → main →
      master), push, pull, branch switching, and PR creation. Default action when invoked without instructions: smart
      commit.
    category: tools-and-configurations
    plugin: git-and-delivery
  - path: agents/debugger.md
    type: agent
    tags:
      - debugging
      - spec-kit
    description: >-
      Fixes failing tests or defects in the same isolated worktree where the Tester reported failure; signals
      Orchestrator to re-run Tester. Reads memory from memory/ at the repo root.
    category: quality-assurance
    plugin: speckit
  - path: agents/dependency-updater.md
    type: agent
    tags:
      - common
      - npm
    description: >-
      Dependency & Migration Strategist: scans package manifests, audits versions against registries, classifies updates
      by SemVer tier, and produces a structured migration report with ordered upgrade plan, impact analysis, and links
      to changelogs and migration guides.
    category: tools-and-configurations
    plugin: git-and-delivery
    bundles:
      - common
  - path: agents/implementer.md
    type: agent
    tags:
      - spec-kit
    description: >-
      Implements code only inside the Orchestrator-assigned Git worktree. No cross-worktree reads; follows project
      standards for later Sonar/review on the phase branch. Reads specs from specs/ at the repo root; uses Speckit
      commands when applicable.
    category: workflows-and-processes
    plugin: speckit
  - path: agents/orchestrator.md
    type: agent
    tags:
      - git
      - spec-kit
    description: >-
      Orchestrates the agentic lifecycle using a parallel Git worktree strategy: phase branch, isolated spec worktrees,
      mandatory tester gate before merge, reconciliation on phase, then reviewer. Invokes Archivist at phase start
      (recall) and after quality closure (learn). All agents use Speckit commands exclusively; specs/ and memory/ live
      at the repo root.
    category: workflows-and-processes
    plugin: speckit
  - path: agents/qa-tester.md
    type: agent
    tags:
      - e2e
      - spec-kit
      - testing
    description: >-
      E2E test gap analysis agent. Deeply studies ALL project specifications to understand conventions, depth, and
      patterns, then extracts UI-facing user stories, identifies which ones lack E2E test coverage, and produces rich,
      context-aware /specify prompts for writing full user-journey test specs. Use proactively when you need to audit
      E2E coverage or plan E2E test specifications across the project. Requires Opus 4.6 Max Thinking for thorough spec
      analysis and reasoning.
    category: quality-assurance
    plugin: speckit
  - path: agents/reviewer.md
    type: agent
    tags:
      - spec-kit
    description: >-
      Final quality audit on phase branch after parallel spec merges: logical conflicts, Sonar. ALWAYS uses
      /speckit.analyze command. Authorizes merge to main only after quality gate passes.
    category: quality-assurance
    plugin: speckit
  - path: agents/scraper.md
    type: agent
    tags:
      - playwright
      - scraping
    description: >-
      Pure web navigator powered by Playwright MCP. Crawls pages, extracts raw DOM data (tables, structured data,
      metadata), captures screenshots and accessibility snapshots. Produces artifacts in SCRAP/{domain}/. Never analyzes
      or interprets.
    category: other
    plugin: testing-and-debugging
  - path: agents/specifier.md
    type: agent
    tags:
      - spec-kit
    description: >-
      Technical blueprint for one spec: clear boundaries, shared-file warnings. ALWAYS uses /speckit.specify command;
      specs live under specs/ at the repo root.
    category: workflows-and-processes
    plugin: speckit
  - path: agents/tester.md
    type: agent
    tags:
      - spec-kit
      - testing
    description: >-
      Runs the test suite in the isolated worktree; gates merge until success. On failure, produces logs for the
      Debugger in the same worktree context. Reads specs from specs/ and memory from memory/ at the repo root.
    category: quality-assurance
    plugin: speckit
  - path: commands/debug.md
    type: command
    tags:
      - debugging
    description: "Debugging command guide: static analysis, logging and runtime checks."
    category: quality-assurance
    plugin: testing-and-debugging
  - path: commands/env-setup.md
    type: command
    tags:
      - docker
      - hub
    description: >-
      Manage dual-mode environment files (Hub vs hubless/standalone). Generates .env.example, .env.hub.example
      (committed templates) and .env.hub, .env.hubless (local ready-to-use presets). Audits .gitignore and detects the
      current .env mode.
    category: tools-and-configurations
    plugin: modelo-internal
  - path: commands/git.md
    type: command
    tags:
      - git
    description: >-
      Manages all Git operations: semantic commits, branching, rebasing, merging, and history hygiene. Interprets user
      intent in Git jargon; asks for clarification on ambiguity. Enforces the semantic commit rule
      (4-semantic-commits.mdc) for every commit.
    category: tools-and-configurations
    plugin: git-and-delivery
  - path: commands/improve.md
    type: command
    tags:
      - refactoring
    description: >-
      Continuous code improvement agent. Iterates on project quality by leveraging SonarQube (MCP + CLI scanner) and
      dedicated Git branches. Loop: Scan → Analyze → Plan → Fix → Review → Re-scan until Quality Gate is green.
    category: quality-assurance
    plugin: git-and-delivery
  - path: commands/k8s-troubleshoot.md
    type: command
    tags:
      - devops
      - infrastructure
      - kubernetes
    description: >-
      Diagnose and resolve Kubernetes infrastructure issues. Identifies pod errors, applies in-scope fixes (ConfigMap,
      rollout), and generates DevOps reports for out-of-scope problems. All kubectl commands run inside Docker.
    category: tools-and-configurations
    plugin: docker-and-k8s
  - path: commands/merge.md
    type: command
    tags:
      - git
    description: >-
      Merge current branch into the target using the gitter agent. Cautious about regressions. If the merge strategy is
      ambiguous or not specified, asks the user for clarification before proceeding.
    category: tools-and-configurations
    plugin: git-and-delivery
    bundles:
      - common
  - path: commands/pr-history.md
    type: command
    tags:
      - git
      - github
      - shell
    description: >-
      Show the latest merged pull request descriptions in the terminal, newest merge first, so the project state and
      recent work are easy to scan.
    category: tools-and-configurations
    plugin: git-and-delivery
  - path: commands/pre-kubify.md
    type: command
    tags:
      - devops
      - infrastructure
      - kubernetes
    description: >-
      Scans a project to produce a concise infrastructure readiness report for the DevOps team before running /kubify.
      Detects env vars, secrets, build-time vs runtime config, services topology, and generates ASCII architecture
      diagrams for pprod and prod environments.
    category: tools-and-configurations
    plugin: docker-and-k8s
  - path: commands/push.md
    type: command
    tags:
      - git
    description: >-
      Push current branch to the remote using the gitter agent. If the current branch is a feature branch, returns a
      link to create a Pull Request with a suggested description.
    category: tools-and-configurations
    plugin: git-and-delivery
    bundles:
      - common
  - path: commands/scrape-site.md
    type: command
    tags:
      - playwright
      - scraping
    description: >-
      Intent-driven web scraping orchestrator. Detects scraping intent from natural language, builds a structured brief,
      delegates to the scraper agent, and verifies deliverables. Supports data extraction, user flow analysis, site
      structure cloning, and general-purpose scraping with configurable parameters.
    category: other
    plugin: testing-and-debugging
  - path: commands/spec-release-and-versioning.md
    type: command
    tags:
      - ci-cd
      - versioning
    description: >-
      Transform a versioning or release-related need into a full Speckit specification. Covers application version
      metadata contracts, UI display rules, semantic-release CI/CD governance, and migration planning. References the
      app-version-surface and semantic-release-js-ts-pipeline skills.
    category: tools-and-configurations
    plugin: speckit
  - path: commands/spt.md
    type: command
    tags:
      - cursor
      - spec-kit
    description: Run the full Specify → Plan → Tasks pipeline in one shot, pausing if any step requires user input.
    category: workflows-and-processes
    plugin: speckit
  - path: hooks/conversation-focus-prompt.sh
    type: hook
    tags:
      - claude
      - hooks
    description: >-
      UserPromptSubmit hook of the conversation-focus skill: injects the split check and the italic closing summary rule
      before the agent replies, plus the external links of past summaries read from the transcript.
    category: devx-and-agentic
    plugin: agent-sessions
  - path: hooks/conversation-focus-stop.sh
    type: hook
    tags:
      - claude
      - hooks
    description: >-
      Stop hook of the conversation-focus skill: blocks the stop once when the reply's last paragraph is not an italic
      summary; never loops (stop_hook_active).
    category: devx-and-agentic
    plugin: agent-sessions
  - path: hooks/enforce-tools.sh
    type: hook
    tags:
      - cursor
      - hooks
      - shell
    description: Cursor beforeShellExecution hook that suggests modern CLI tools instead of legacy ones (pure Bash, no jq).
    category: devx-and-agentic
    plugin: agent-tooling
  - path: hooks/pilot-reminder.sh
    type: hook
    tags:
      - claude
      - hooks
    description: >-
      UserPromptSubmit / SessionStart hook of the pilot-session skill: re-injects a short autonomy reminder
      (skills/pilot-session/templates/pilot-reminder.md) in sessions registered with session-meta `role pilot`; silent
      for every other session and on any error.
    category: devx-and-agentic
    plugin: agent-sessions
  - path: hooks/registry-sync-on-skill.sh
    type: hook
    tags:
      - claude
      - cursor
      - hooks
      - shell
    description: >-
      Post-edit hook that fires when a SKILL.md is created or edited and checks whether the skill's directory is already
      referenced in asset-registry.yml. If not, it reminds the agent (per AGENTS.md) to register the skill in the same
      change; silent when already registered. Supports Claude PostToolUse and Cursor afterFileEdit. Reminder-only —
      never rewrites the registry. Disable with REGISTRY_SYNC=0.
    category: devx-and-agentic
    plugin: agent-tooling
  - path: hooks/session-title-ask.sh
    type: hook
    tags:
      - claude
      - hooks
      - shell
    description: >-
      Claude PreToolUse hook (matcher AskUserQuestion) that denies the first click-to-answer question once, asking the
      agent to rename the desktop session to "🙋 À trancher · <topic>" before asking again, since an interactive
      question never ends the turn and the Stop hook never runs. Never denies twice within SESSION_TITLE_GATE_TTL
      seconds; clears the Stop fingerprint so the next turn re-titles. Desktop and attended sessions only. Disable with
      SESSION_TITLE_SYNC=0.
    category: devx-and-agentic
    plugin: agent-sessions
  - path: hooks/session-title-close-kids.sh
    type: hook
    tags:
      - claude
      - hooks
      - shell
    description: >-
      Claude UserPromptSubmit hook for pilot sessions: when a side session the pilot started is titled to-close ("📦 To
      close · …") or closed ("✅ Closed · …"), read deterministically from the app's session files through
      `session-title.sh closable`, it asks the pilot to archive it with archive_session. Each side session is reported
      once. Desktop sessions only. Disable with SESSION_TITLE_CLOSE_KIDS=0 or SESSION_TITLE_SYNC=0.
    category: devx-and-agentic
    plugin: agent-sessions
  - path: hooks/session-title-progress.sh
    type: hook
    tags:
      - claude
      - hooks
      - shell
    description: >-
      Claude PostToolUse hook (matcher Agent|Task|Edit|Write|MultiEdit) that keeps the "🔨 À implémenter D/T" counter of
      a spec session live during a long turn: when tasks.md finishes a phase (or a task, with progress.every = "task"),
      it hands the agent the exact new title through additionalContext. Ignores tool calls made inside subagents, which
      cannot rename their parent. Desktop and attended sessions only; silent in scheduled runs. Disable with
      SESSION_TITLE_SYNC=0.
    category: devx-and-agentic
    plugin: agent-sessions
  - path: hooks/session-title-sync.sh
    type: hook
    tags:
      - claude
      - hooks
      - shell
      - spec-kit
    description: >-
      Claude Stop hook that gathers the session's facts through the session-title skill (spec or free session, spec-kit
      stage, git, PR, question ending) and, once per new set of facts, blocks the stop with a reason asking the agent to
      judge the human's next action and rename the desktop session from the fixed templates ("À merger", "À tester", "À
      clôturer"). Desktop and attended sessions only; never loops (honours stop_hook_active). Disable with
      SESSION_TITLE_SYNC=0.
    category: devx-and-agentic
    plugin: agent-sessions
  - path: hooks/session-title-watcher-check.sh
    type: hook
    tags:
      - claude
      - hooks
      - shell
    description: >-
      Claude SessionStart hook that reads the freshness watcher heartbeat (`session-title.sh watcher-status`) and, when
      no watcher is alive on the machine (fresh device, app restarted, watcher archived), asks the agent to propose one
      as a New task card in its own worktree, so the age dots never freeze silently. At most one proposal per
      SESSION_TITLE_NAG_TTL seconds machine-wide; silent on compaction, /clear and scheduled runs. Desktop and attended
      sessions only. Disable with SESSION_TITLE_SYNC=0.
    category: devx-and-agentic
    plugin: agent-sessions
  - path: hooks/session-title-working.sh
    type: hook
    tags:
      - claude
      - hooks
      - shell
    description: >-
      Claude UserPromptSubmit hook that asks the agent to make its first tool call a rename to the working title as soon
      as a message arrives — an activity from a fixed catalogue, "🔵 🛠️ Coding 3/14 · <subject>", with the spec slug
      kept as subject in a spec session. The Stop hook restores or re-judges the title at the end of the turn. Desktop
      and attended sessions only; silent in scheduled runs. Disable with SESSION_TITLE_SYNC=0.
    category: devx-and-agentic
    plugin: agent-sessions
  - path: rules/00-architecture/0-hexagonal-ddd.mdc
    type: rule
    tags:
      - architecture
      - ddd
      - hexagonal
    description: >-
      Hexagonal (ports/adapters) layering: pure domain, application use cases, infrastructure adapters. Dependency rule
      and mandatory design properties.
    category: architecture
  - path: rules/00-architecture/0-makefile-structure.mdc
    type: rule
    tags:
      - docker
      - make
    description: >-
      Root Makefile invariants: mandatory targets, env-driven configuration, PHONY targets, and Docker-first execution.
      Templates live in a skill.
    category: architecture
    bundles:
      - common
  - path: rules/00-architecture/0-monorepo.mdc
    type: rule
    tags:
      - architecture
      - monorepo
    description: >-
      Monorepo workspace invariants: package boundaries, acyclic package graph, shared contracts, and no upward imports
      from shared libraries to apps.
    category: architecture
  - path: rules/00-architecture/0-rules-structure.mdc
    type: rule
    tags:
      - cursor
      - meta
      - rules
    description: >-
      Conventions for the rules/ tree: category folders, .mdc naming, required frontmatter, and how globs scope each
      rule. Apply when creating or moving rules.
    category: architecture
  - path: rules/00-architecture/0-vertical-slices.mdc
    type: rule
    tags:
      - architecture
      - vertical-slices
    description: >-
      Vertical-slice and functional-core / imperative-shell properties: where pure logic lives, how slices integrate,
      and a decision policy for where edits go.
    category: architecture
  - path: rules/01-standards/1-code-documentation-for-indexing.mdc
    type: rule
    tags:
      - documentation
      - indexing
      - quality
    description: >-
      Rich inline documentation so embeddings and static analysis can resolve intent, relationships, and usage without
      reading the whole file.
    category: standards
    bundles:
      - common
  - path: rules/01-standards/1-pure-domain.mdc
    type: rule
    tags:
      - architecture
      - domain
      - purity
    description: >-
      Language-agnostic pure domain: no side effects in core logic, errors as values, no I/O in domain types.
      Complements language-specific 2-pure-domain.
    category: standards
  - path: rules/02-programming-languages/2-anti-currying.mdc
    type: rule
    tags:
      - fp-ts
      - typescript
    description: Rule 3 — Avoid deep currying and excessive point-free style; prefer named parameters and readable steps.
    category: programming-languages
  - path: rules/02-programming-languages/2-explicit-typing.mdc
    type: rule
    tags:
      - typescript
    description: Rule 1 — Explicit typing in domain code (no any, explicit function signatures) for LSP and RAG-friendly contracts.
    category: programming-languages
  - path: rules/02-programming-languages/2-pure-domain.mdc
    type: rule
    tags:
      - fp-ts
      - nestjs
      - typescript
    description: >-
      Rule 4 — Pure functional core: no NestJS/I/O/throw in domain; typed errors; optional single-file domain for small
      modules.
    category: programming-languages
  - path: rules/02-programming-languages/2-semantic-jsdoc.mdc
    type: rule
    tags:
      - documentation
      - typescript
    description: Rule 2 — File-level and per-function JSDoc with @description for embedding-friendly domain documentation.
    category: programming-languages
  - path: rules/03-frameworks-and-libraries/3-flat-orchestration.mdc
    type: rule
    tags:
      - nestjs
      - typescript
    description: "Rule 5 — NestJS use cases as thin injectable services: sequential pipe from validation to domain to persistence."
    category: frameworks-and-libraries
  - path: rules/03-frameworks-and-libraries/3-lit.mdc
