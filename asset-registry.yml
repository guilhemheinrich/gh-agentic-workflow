    description: >-
      Show what a change does to a relational database, before it is written, in two separate reports whose shape never
      drifts. The schema view answers which tables are touched and what moves structurally — columns, indexes,
      constraints, the migration, whether it is reversible. The effect view answers the other question entirely: what
      one use case does to the data, step by step — which rows match, which value replaces which, what refuses to write,
      and the net tally of rows inserted, updated and deleted. Ships `scripts/dataproj.py`, which owns every structural
      decision through closed operation vocabularies: an op outside the enum is a validation error, the glyphs and
      tallies are derived, and prose exists in exactly one column. The anchors are real, not declarative: task ids must
      exist in `tasks.md`, every declared DDL operation must be found in the migration files it names (raw SQL, TypeORM,
      Alembic — Django and ActiveRecord report as unverifiable rather than contradicted), and every write effect must
