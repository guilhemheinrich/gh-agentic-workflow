# yaml-language-server: $schema=./asset-registry.schema.json
version: 2.0.0
x-tag-descriptions:
  astro: Astro framework, static site generation
  auth: Authentication, SSO, Keycloak
  ci-cd: CI/CD pipelines, releases
  css: CSS, Tailwind, UX layout
  claude: Claude Code agent configuration and hooks
  cursor: Cursor IDE skills, hooks, rules
  debugging: Debugging, investigation, troubleshooting
  docker: Docker, Dockerfile, images
  docker-compose: Docker Compose orchestration
  documentation: Documentation, Diátaxis, JSDoc
  e2e: End-to-end testing (Playwright, Cypress)
  eslint: Linting, static analysis
  fp-ts: fp-ts / Effect functional programming
  frontend: Frontend development, UI frameworks
  git: Git, branching, commits
  github: GitHub CLI, Actions, PRs
  hub: Modelo Hub, app registry, SSO ecosystem
  keycloak: Keycloak identity and access management
  kubernetes: Kubernetes, Helm, orchestration
  hooks: Editor-agent hooks (PostToolUse, afterFileEdit)
  lint: Linting, static analysis, code quality
  lit: Lit web components framework
  lsp: Language Server Protocol, code intelligence
  make: Makefile patterns and conventions
  mcp: Model Context Protocol servers and clients
  monorepo: Monorepo, Turborepo, workspaces
  nestjs: NestJS framework
  npm: npm, private registry, packages
  nuxt: Nuxt framework
  playwright: Playwright browser automation, E2E testing
  prisma: Prisma ORM
  python: Python
  react: React ecosystem
  refactoring: Refactoring, code improvement
  scraping: Web scraping and content extraction
  security: Security, hardening, encryption
  sentry: Sentry observability, error tracking
  shell: Shell scripts, CLI tools, bash
  sonarqube: SonarQube code quality
  spec-kit: SpecKit workflow, specification tools
  sql: SQL databases, migrations, schemas
  starlight: Starlight documentation framework
  testing: Testing, unit and integration tests
  tdd: Test-Driven Development methodology
  typescript: TypeScript / JavaScript
  validation: Validation (Zod, Effect Schema, io-ts)
  versioning: Versioning, semantic-release
  vitest: Vitest unit test framework
  vscode: VS Code extensions, settings, and editor configuration
  vue: Vue.js ecosystem
  web-components: Web Components, Lit
assets:
- path: .agents/skills/documentation-writer/
  type: skill
  tags:
  - documentation
  description: Diátaxis Documentation Expert. An expert technical writer specializing
    in creating high-quality software documentation, guided by the principles and
    structure of the Diátaxis technical documentation authoring framework.
  category: standards
- path: .agents/skills/gh-cli/
  type: skill
  tags:
  - github
  - shell
  description: GitHub CLI (gh) comprehensive reference for repositories, issues, pull
    requests, Actions, projects, releases, gists, codespaces, organizations, extensions,
    and all GitHub operations from the command line.
  category: tools-and-configurations
- path: .agents/skills/git-commit/
  type: skill
  tags:
  - git
  category: tools-and-configurations
- path: .agents/skills/k8s-troubleshoot/
  type: skill
  tags:
  - docker
  - kubernetes
  description: Diagnose and resolve Kubernetes infrastructure issues using kubectl
    via Docker. Covers pod diagnostics, ConfigMap modifications, rollout management,
    and DevOps report generation for out-of-scope actions.
  category: tools-and-configurations
- path: .agents/skills/speckit-git-commit/
  type: skill
  tags:
  - git
  - spec-kit
  description: Auto-commit changes after a Spec Kit command completes
  category: workflows-and-processes
- path: .agents/skills/speckit-git-feature/
  type: skill
  tags:
  - git
  - spec-kit
  description: Create a feature branch with sequential or timestamp numbering
  category: workflows-and-processes
- path: .agents/skills/speckit-git-initialize/
  type: skill
  tags:
  - git
  - spec-kit
  description: Initialize a Git repository with an initial commit
  category: workflows-and-processes
- path: .agents/skills/speckit-git-remote/
  type: skill
  tags:
  - git
  - github
  description: Detect Git remote URL for GitHub integration
  category: workflows-and-processes
- path: .agents/skills/speckit-git-validate/
  type: skill
  tags:
  - git
  - spec-kit
  description: Validate current branch follows feature branch naming conventions
  category: workflows-and-processes
- path: .cursor/commands/k8s-troubleshoot.md
  type: command
  tags:
  - kubernetes
  description: Diagnose and resolve Kubernetes infrastructure issues. Identifies pod
    errors, applies in-scope fixes (ConfigMap, rollout), and generates DevOps reports
    for out-of-scope problems. All kubectl commands run inside Docker.
  category: other
- path: .cursor/commands/speckit.analyze.md
  type: command
  tags:
  - cursor
  - spec-kit
  description: Perform a non-destructive cross-artifact consistency and quality analysis
    across spec.md, plan.md, and tasks.md after task generation.
  category: other
- path: .cursor/commands/speckit.checklist.md
  type: command
  tags:
  - cursor
  - spec-kit
  description: Generate a custom checklist for the current feature based on user requirements.
  category: other
- path: .cursor/commands/speckit.clarify.md
  type: command
  tags:
  - cursor
  - spec-kit
  description: Identify underspecified areas in the current feature spec by asking
    up to 5 highly targeted clarification questions and encoding answers back into
    the spec.
  category: other
- path: .cursor/commands/speckit.constitution.md
  type: command
  tags:
  - cursor
  - spec-kit
  description: Create or update the project constitution from interactive or provided
    principle inputs, ensuring all dependent templates stay in sync.
  category: other
- path: .cursor/commands/speckit.fleet.review.md
  type: command
  tags:
  - cursor
  - spec-kit
  description: Cross-model evaluation of plan.md and tasks.md before implementation.
    Reviews feasibility, completeness, dependency ordering, risk, and parallelization
    correctness using a different model than was used to generate the artifacts.
  category: other
- path: .cursor/commands/speckit.fleet.run.md
  type: command
  tags:
  - ci-cd
  - cursor
  - spec-kit
  description: 'Orchestrate a full feature lifecycle through all SpecKit phases with
    human-in-the-loop checkpoints: specify -> clarify -> plan -> checklist -> tasks
    -> analyze -> cross-model review -> implement -> verify -> CI. Detects partially
    complete features and resumes from the right phase.'
  category: other
- path: .cursor/commands/speckit.implement.md
  type: command
  tags:
  - cursor
  - spec-kit
  description: Execute the implementation plan by processing and executing all tasks
    defined in tasks.md
  category: other
- path: .cursor/commands/speckit.plan.md
  type: command
  tags:
  - cursor
  - spec-kit
  description: Execute the implementation planning workflow using the plan template
    to generate design artifacts.
  category: other
- path: .cursor/commands/speckit.specify.md
  type: command
  tags:
  - cursor
  - spec-kit
  description: Create or update the feature specification from a natural language
    feature description.
  category: other
- path: .cursor/commands/speckit.tasks.md
  type: command
  tags:
  - cursor
  - spec-kit
  description: Generate an actionable, dependency-ordered tasks.md for the feature
    based on available design artifacts.
  category: other
- path: .cursor/commands/speckit.taskstoissues.md
  type: command
  tags:
  - cursor
  - github
  - spec-kit
  description: Convert existing tasks into actionable, dependency-ordered GitHub issues
    for the feature based on available design artifacts.
  category: other
- path: .cursor/commands/speckit.verify.run.md
  type: command
  tags:
  - cursor
  - spec-kit
  - testing
  description: Perform a non-destructive post-implementation verification gate validating
    the implementation against spec.md, plan.md, tasks.md, and constitution.md.
  category: other
- path: .cursor/commands/spt.md
  type: command
  tags:
  - cursor
  - spec-kit
  description: Run the full Specify → Plan → Tasks pipeline in one shot, pausing if
    any step requires user input.
  category: other
- path: .cursor/rules/0-rules-structure.mdc
  type: rule
  tags:
  - cursor
  description: 'Conventions for the rules/ tree: category folders, .mdc naming, required
    frontmatter, and how globs scope each rule. Apply when creating or moving rules.'
  category: architecture
- path: .cursor/rules/4-specify-rules.mdc
  type: rule
  tags:
  - cursor
  - spec-kit
  description: 'Meta pointer: canonical rules live under rules/ by category; use specify-rules
    with the architecture and standards entries for this repo.'
  category: workflows-and-processes
- path: .cursor/rules/specify-rules.mdc
  type: rule
  tags:
  - cursor
  - spec-kit
  description: 'Meta pointer: canonical project rules are under rules/; use this file
    to find architecture, NestJS, and spec-kit context without duplicating long rules.'
  category: workflows-and-processes
- path: .specify/extensions/fleet/commands/fleet.md
  type: command
  tags:
  - spec-kit
  description: 'Orchestrate a full feature lifecycle through all SpecKit phases with
    human-in-the-loop checkpoints: specify -> clarify -> plan -> checklist -> tasks
    -> analyze -> cross-model review -> implement -> verify -> CI. Detects partially
    complete features and resumes from the right phase.'
  category: workflows-and-processes
- path: .specify/extensions/fleet/commands/review.md
  type: command
  tags:
  - spec-kit
  description: Cross-model evaluation of plan.md and tasks.md before implementation.
    Reviews feasibility, completeness, dependency ordering, risk, and parallelization
    correctness using a different model than was used to generate the artifacts.
  category: workflows-and-processes
- path: .specify/extensions/git/commands/speckit.git.commit.md
  type: command
  tags:
  - git
  - spec-kit
  description: Auto-commit changes after a Spec Kit command completes
  category: workflows-and-processes
- path: .specify/extensions/git/commands/speckit.git.feature.md
  type: command
  tags:
  - git
  - spec-kit
  description: Create a feature branch with sequential or timestamp numbering
  category: workflows-and-processes
- path: .specify/extensions/git/commands/speckit.git.initialize.md
  type: command
  tags:
  - git
  - spec-kit
  description: Initialize a Git repository with an initial commit
  category: workflows-and-processes
- path: .specify/extensions/git/commands/speckit.git.remote.md
  type: command
  tags:
  - git
  - github
  description: Detect Git remote URL for GitHub integration
  category: workflows-and-processes
- path: .specify/extensions/git/commands/speckit.git.validate.md
  type: command
  tags:
  - git
  - spec-kit
  description: Validate current branch follows feature branch naming conventions
  category: workflows-and-processes
- path: .specify/extensions/verify/commands/verify.md
  type: command
  tags:
  - spec-kit
  - testing
  description: Perform a non-destructive post-implementation verification gate validating
    the implementation against spec.md, plan.md, tasks.md, and constitution.md.
  category: workflows-and-processes
- path: agents/archivist.md
  type: agent
  tags:
  - documentation
  - spec-kit
  description: 'Manages the project knowledge graph at memory/ (repo root): recall
    (inject tactical/strategic constraints at phase start) and learn (extract insights
    after merge). ALWAYS uses /speckit.memory command for the structured digest. Deduplicates
    rules; updates operational/tactical/strategic scopes.'
  category: workflows-and-processes
- path: agents/cartographer.md
  type: agent
  tags:
  - spec-kit
  description: Roadmap and feature planning agent. Delegates to this agent when the
    user needs to plan a roadmap, break down a project into features, prioritize work,
    or scope a phase of development. Runs /specify with a phase-level perspective.
    Use proactively when a project needs strategic planning before individual feature
    specification. Requires Opus 4.6 Max Thinking for deep strategic reasoning and
    critical analysis.
  category: workflows-and-processes
- path: agents/debugger.md
  type: agent
  tags:
  - debugging
  - spec-kit
  description: Fixes failing tests or defects in the same isolated worktree where
    the Tester reported failure; signals Orchestrator to re-run Tester. Reads memory
    from memory/ at the repo root.
  category: quality-assurance
- path: agents/dependency-updater.md
  type: agent
  tags:
  - npm
  description: 'Dependency & Migration Strategist: scans package manifests, audits
    versions against registries, classifies updates by SemVer tier, and produces a
    structured migration report with ordered upgrade plan, impact analysis, and links
    to changelogs and migration guides.'
  category: tools-and-configurations
  bundles:
  - common
- path: agents/gitter.md
  type: agent
  tags:
  - git
  - github
  description: 'Handles everyday Git workflows: analyzes all pending changes, groups
    them into logical batches, and commits each with a semantic conventional message.
    Manages merge across the branch hierarchy (develop → staging → main → master),
    push, pull, branch switching, and PR creation. Default action when invoked without
    instructions: smart commit.'
  category: tools-and-configurations
  bundles:
  - common
- path: agents/implementer.md
  type: agent
  tags:
  - spec-kit
  description: Implements code only inside the Orchestrator-assigned Git worktree.
    No cross-worktree reads; follows project standards for later Sonar/review on the
    phase branch. Reads specs from specs/ at the repo root; uses Speckit commands
    when applicable.
  category: workflows-and-processes
- path: agents/orchestrator.md
  type: agent
  tags:
  - git
  - spec-kit
  description: 'Orchestrates the agentic lifecycle using a parallel Git worktree strategy:
    phase branch, isolated spec worktrees, mandatory tester gate before merge, reconciliation
    on phase, then reviewer. Invokes Archivist at phase start (recall) and after quality
    closure (learn). All agents use Speckit commands exclusively; specs/ and memory/
    live at the repo root.'
  category: workflows-and-processes
- path: agents/qa-tester.md
  type: agent
  tags:
  - e2e
  - spec-kit
  - testing
  description: E2E test gap analysis agent. Deeply studies ALL project specifications
    to understand conventions, depth, and patterns, then extracts UI-facing user stories,
    identifies which ones lack E2E test coverage, and produces rich, context-aware
    /specify prompts for writing full user-journey test specs. Use proactively when
    you need to audit E2E coverage or plan E2E test specifications across the project.
    Requires Opus 4.6 Max Thinking for thorough spec analysis and reasoning.
  category: quality-assurance
- path: agents/reviewer.md
  type: agent
  tags:
  - spec-kit
  description: 'Final quality audit on phase branch after parallel spec merges: logical
    conflicts, Sonar. ALWAYS uses /speckit.analyze command. Authorizes merge to main
    only after quality gate passes.'
  category: quality-assurance
- path: agents/scraper.md
  type: agent
  tags:
  - playwright
  - scraping
  description: Pure web navigator powered by Playwright MCP. Crawls pages (same-domain
    BFS), extracts raw DOM data (tables, structured data, metadata), captures screenshots
    and accessibility snapshots. Produces artifacts in SCRAP/{domain}/. Never analyzes
    or interprets — only navigates and reports raw observations.
  category: other
- path: agents/specifier.md
  type: agent
  tags:
  - spec-kit
  description: 'Technical blueprint for one spec: clear boundaries, shared-file warnings.
    ALWAYS uses /speckit.specify command; specs live under specs/ at the repo root.'
  category: workflows-and-processes
- path: agents/tester.md
  type: agent
  tags:
  - spec-kit
  - testing
  description: Runs the test suite in the isolated worktree; gates merge until success.
    On failure, produces logs for the Debugger in the same worktree context. Reads
    specs from specs/ and memory from memory/ at the repo root.
  category: quality-assurance
- path: commands/commit.md
  type: command
  tags:
  - git
  description: Smart commit using the gitter agent. Analyzes all pending changes,
    groups them into logical semantic batches, and commits each with a conventional
    message.
  category: tools-and-configurations
  bundles:
  - common
- path: commands/env-setup.md
  type: command
  tags:
  - docker
  - hub
  description: Manage dual-mode environment files (Hub vs hubless/standalone). Generates
    .env.example, .env.hub.example (committed templates) and .env.hub, .env.hubless
    (local ready-to-use presets). Audits .gitignore and detects the current .env mode.
  category: tools-and-configurations
- path: commands/improve.md
  type: command
  tags:
  - refactoring
  description: 'Continuous code improvement agent. Iterates on project quality by
    leveraging SonarQube (MCP + CLI scanner) and dedicated Git branches. Loop: Scan
    → Analyze → Plan → Fix → Review → Re-scan until Quality Gate is green.'
  category: quality-assurance
- path: commands/k8s-troubleshoot.md
  type: command
  tags:
  - kubernetes
  description: Diagnose and resolve Kubernetes infrastructure issues. Identifies pod
    errors, applies in-scope fixes (ConfigMap, rollout), and generates DevOps reports
    for out-of-scope problems. All kubectl commands run inside Docker.
  category: tools-and-configurations
- path: commands/specify-mcp-backend.md
  type: command
  tags:
  - documentation
  - security
  - spec-kit
  description: Generic prompt for /speckit.specify to create a backend MCP server
    specification. Covers transport choice, endpoint contract, JSON-RPC lifecycle,
    capability modeling, security, observability, testing, and rollout.
  category: templates-and-models
- path: commands/specify-mcp-chatbot.md
  type: command
  tags:
  - react
  - security
  - spec-kit
  - typescript
  description: Generic prompt for /speckit.specify to create an MCP-powered chatbot
    or frontend client specification. Covers chat UI, product chat endpoints, streaming
    events, MCP client lifecycle, backend orchestration boundaries, security, testing,
    and rollout.
  category: templates-and-models
- path: commands/merge.md
  type: command
  tags:
  - git
  description: Merge current branch into the target using the gitter agent. Cautious
    about regressions. If the merge strategy is ambiguous or not specified, asks the
    user for clarification before proceeding.
  category: tools-and-configurations
  bundles:
  - common
- path: commands/pre-kubify.md
  type: command
  tags:
  - kubernetes
  description: Scans a project to produce a concise infrastructure readiness report
    for the DevOps team before running /kubify. Detects env vars, secrets, build-time
    vs runtime config, services topology, and generates ASCII architecture diagrams
    for pprod and prod environments.
  category: tools-and-configurations
- path: commands/push.md
  type: command
  tags:
  - git
  description: Push current branch to the remote using the gitter agent. If the current
    branch is a feature branch, returns a link to create a Pull Request with a suggested
    description.
  category: tools-and-configurations
  bundles:
  - common
- path: commands/specify-qa.md
  type: command
  tags:
  - e2e
  - spec-kit
  - testing
  description: E2E specification command driven by project analysis. Scans all existing
    specs to learn conventions, identifies E2E gaps, and directly produces complete
    specs (spec.md, plan.md, tasks.md) aligned with project quality and patterns.
    Unlike qa-tester (analysis only), this command produces deliverables.
  category: quality-assurance
- path: commands/scrape-site.md
  type: command
  tags:
  - playwright
  - scraping
  description: Intent-driven scraping orchestrator. Detects scraping goal (data extraction,
    user flow, site structure), builds a scoped brief, delegates to the scraper agent,
    and verifies deliverables. Never navigates or extracts data itself.
  category: other
- path: .agents/skills/web-analysis/SKILL.md
  type: skill
  tags:
  - docker
  - security
  description: Deterministic web analysis tools executable via Docker. Covers Lighthouse
    (performance), pa11y (accessibility), sitespeed.io (metrics), broken-link-checker,
    security headers, Wappalyzer (tech detection), and html-validate. All tools produce
    machine-readable output without host dependencies.
  category: quality-assurance
- path: commands/spec-release-and-versioning.md
  type: command
  tags:
  - ci-cd
  - versioning
  description: Transform a versioning or release-related need into a full Speckit
    specification. Covers application version metadata contracts, UI display rules,
    semantic-release CI/CD governance, and migration planning. References the app-version-surface
    and semantic-release-js-ts-pipeline skills.
  category: tools-and-configurations
- path: commands/spt.md
  type: command
  tags:
  - cursor
  - spec-kit
  description: Run the full Specify → Plan → Tasks pipeline in one shot, pausing if
    any step requires user input.
  category: workflows-and-processes
- path: rules/00-architecture/0-hexagonal-ddd.mdc
  type: rule
  description: 'Hexagonal (ports/adapters) layering: pure domain, application use
    cases, infrastructure adapters. Dependency rule and mandatory design properties.'
  category: architecture
- path: rules/00-architecture/0-makefile-structure.mdc
  type: rule
  tags:
  - docker
  - make
  description: 'Root Makefile invariants: mandatory targets, env-driven configuration,
    PHONY targets, and Docker-first execution. Templates live in a skill.'
  category: architecture
  bundles:
  - common
- path: rules/00-architecture/0-monorepo.mdc
  type: rule
  tags:
  - monorepo
  description: 'Monorepo workspace invariants: package boundaries, acyclic package
    graph, shared contracts, and no upward imports from shared libraries to apps.'
  category: architecture
- path: rules/00-architecture/0-rules-structure.mdc
  type: rule
  tags:
  - cursor
  description: 'Conventions for the rules/ tree: category folders, .mdc naming, required
    frontmatter, and how globs scope each rule. Apply when creating or moving rules.'
  category: architecture
- path: rules/00-architecture/0-vertical-slices.mdc
  type: rule
  description: 'Vertical-slice and functional-core / imperative-shell properties:
    where pure logic lives, how slices integrate, and a decision policy for where
    edits go.'
  category: architecture
- path: rules/01-standards/1-code-documentation-for-indexing.mdc
  type: rule
  tags:
  - documentation
  description: Rich inline documentation so embeddings and static analysis can resolve
    intent, relationships, and usage without reading the whole file.
  category: standards
  bundles:
  - common
- path: rules/01-standards/1-pure-domain.mdc
  type: rule
  description: 'Language-agnostic pure domain: no side effects in core logic, errors
    as values, no I/O in domain types. Complements language-specific 2-pure-domain.'
  category: standards
- path: rules/02-programming-languages/2-anti-currying.mdc
  type: rule
  tags:
  - fp-ts
  - typescript
  description: Rule 3 — Avoid deep currying and excessive point-free style; prefer
    named parameters and readable steps.
  category: programming-languages
- path: rules/02-programming-languages/2-explicit-typing.mdc
  type: rule
  tags:
  - typescript
  description: Rule 1 — Explicit typing in domain code (no any, explicit function
    signatures) for LSP and RAG-friendly contracts.
  category: programming-languages
- path: rules/02-programming-languages/2-pure-domain.mdc
  type: rule
  tags:
  - fp-ts
  - nestjs
  - typescript
  description: 'Rule 4 — Pure functional core: no NestJS/I/O/throw in domain; typed
    errors; optional single-file domain for small modules.'
  category: programming-languages
- path: rules/02-programming-languages/2-semantic-jsdoc.mdc
  type: rule
  tags:
  - documentation
  - typescript
  description: Rule 2 — File-level and per-function JSDoc with @description for embedding-friendly
    domain documentation.
  category: programming-languages
- path: rules/03-frameworks-and-libraries/3-flat-orchestration.mdc
  type: rule
  tags:
  - nestjs
  - typescript
  description: 'Rule 5 — NestJS use cases as thin injectable services: sequential
    pipe from validation to domain to persistence.'
  category: frameworks-and-libraries
- path: rules/03-frameworks-and-libraries/3-lit.mdc
  type: rule
  tags:
  - lit
  - web-components
  description: 'Invariants for Lit-based Web Components: reactivity, lifecycle, shadow
    DOM, and event contract. Cheatsheet and detailed patterns are in a skill.'
  category: frameworks-and-libraries
- path: rules/03-frameworks-and-libraries/3-module-isolation.mdc
  type: rule
  tags:
  - nestjs
  description: Rule 7 — No deep imports across vertical slices; use shared kernel
    or public facades (services/events).
  category: frameworks-and-libraries
- path: rules/03-frameworks-and-libraries/3-nestjs-architecture.mdc
  type: rule
  tags:
  - fp-ts
  - nestjs
  - typescript
  description: NestJS stack and canonical folder layout for vertical-slice modules;
    index of rules R1–R7 and links to fp-ts skills. Use with 0-vertical-slices and
    slice rules.
  category: frameworks-and-libraries
- path: rules/03-frameworks-and-libraries/3-typed-boundaries.mdc
  type: rule
  tags:
  - nestjs
  - typescript
  - validation
  description: Rule 6 — Validate all external I/O with Zod or Effect Schema; technology-prefixed
    infrastructure filenames.
  category: frameworks-and-libraries
- path: rules/03-frameworks-and-libraries/3-vitest-conventions.mdc
  type: rule
  tags:
  - testing
  - typescript
  - vitest
  description: 'Vitest usage for this stack: run via Docker, configs per app, mocks,
    and file layout for Hono/hexagonal services.'
  category: frameworks-and-libraries
- path: rules/03-frameworks-and-libraries/3-wc-live-demos-in-starlight.mdc
  type: rule
  tags:
  - astro
  - documentation
  - starlight
  - web-components
  description: 'Invariants for live Web Component docs in Starlight: iframe isolation,
    bidirectional code↔preview sync, vanilla playground host, controlled component
    contract.'
  category: frameworks-and-libraries
- path: rules/04-tools-and-configurations/4-npm-private-registry.mdc
  type: rule
  tags:
