x-bundle-descriptions:
  common: Stack-agnostic minimum-viable starter set for any project
x-category-descriptions:
  architecture: Architecture patterns and structural principles
  standards: Coding standards and conventions
  programming-languages: Language-specific practices
  frameworks-and-libraries: Framework and library usage
  tools-and-configurations: Tooling, CLIs and configuration
  workflows-and-processes: Development workflows and processes
  templates-and-models: Templates and reusable models
  quality-assurance: Testing, review and quality
  domain-specific: Business-domain specific assets
  philosophy: Project philosophies — paradigms written to PHILOSOPHY.md and referenced from AGENTS.md / CLAUDE.md
  devx-and-agentic: >-
    DevX & Agentic — developer experience and agent harness tooling (session titles, self-improving skills, skill
    discovery, agent hooks)
