name: Publish dist

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'tickets/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: publish-dist
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The `runner` context is not available in job-level `env`, so the
      # build directory is exported from a step instead.
      - name: Set build directory
        run: echo "BUILD_DIR=$RUNNER_TEMP/dist" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Run builder tests
        run: npm run test:plugins

      # Claude Code only offers an update when the plugin `version` string
      # changes, so each publish gets a new semver derived from the v* tags and
      # Conventional Commits (see scripts/plugin-builder/next-version.mjs).
      - name: Compute plugin version
        run: |
          VERSION="$(node scripts/plugin-builder/next-version.mjs)"
          echo "PLUGIN_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Plugin version: $VERSION"

      - name: Build public marketplace
        run: node scripts/build-plugins.mjs --out "$BUILD_DIR" --version "$PLUGIN_VERSION"

      - name: Validate marketplace
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate "$BUILD_DIR" --strict

      - name: Leak check
        run: |
          if grep -r -n -i 'modelo-internal' "$BUILD_DIR"; then
            echo "::error::Private plugin name found in the build output"
            exit 1
          fi
          echo "No private plugin reference found"

      - name: Publish to dist branch
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          WT="$RUNNER_TEMP/dist-worktree"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin dist >/dev/null 2>&1; then
            git fetch origin dist
            git worktree add -B dist "$WT" origin/dist
          else
            git worktree add --detach "$WT"
            git -C "$WT" checkout --orphan dist
            git -C "$WT" rm -rf --quiet . || true
          fi

          # Replace the worktree content with the build (keep only .git)
          find "$WT" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$BUILD_DIR"/. "$WT"/

          cat > "$WT/README.md" <<'README'
          # dist (generated branch)

          This branch is generated by CI from `main`. Do not edit it by hand: any
          change is overwritten on the next publish.

          Add the marketplace in Claude Code:

          ```
          /plugin marketplace add https://github.com/guilhemheinrich/gh-agentic-workflow.git#dist
          ```

          Pull requests go to `main`, never to this branch.
          README

          git -C "$WT" add -A
          if git -C "$WT" diff --cached --quiet; then
            echo "dist: no change, nothing to publish"
            exit 0
          fi
          git -C "$WT" commit -m "chore(dist): publish v$PLUGIN_VERSION ($SHORT_SHA)"
          git -C "$WT" push origin dist

      # Tag only after a successful publish, so the next run bumps from it.
      - name: Tag release
        run: |
          set -euo pipefail
          TAG="v$PLUGIN_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists, nothing to tag"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Plugins $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
