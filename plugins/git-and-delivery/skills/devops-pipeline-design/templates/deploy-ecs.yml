# Template: GitHub Actions -> AWS ECS (backend) + S3/CloudFront (frontend).
# Save as .github/workflows/deploy.yml. Requires GitHub environments `dev`, `staging`,
# `production` with these environment variables: AWS_REGION, AWS_ROLE_TO_ASSUME (OIDC),
# ECR_REPOSITORY, ECS_CLUSTER, ECS_SERVICE, ECS_TASK_DEFINITION (e.g. .aws/task-definition-dev.json),
# CONTAINER_NAME, S3_BUCKET, VITE_API_BASE_URL; optional: CLOUDFRONT_DISTRIBUTION_ID,
# MIGRATION_TASK_DEFINITION, ECS_SUBNETS, ECS_SECURITY_GROUPS.
# Backend only: drop the frontend/S3/CloudFront steps. Frontend only: drop ECR/ECS steps.
# Protect `production` with required reviewers.
name: Deploy

on:
  pull_request:
  push:
    branches:
      - develop
      - staging
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, staging, production]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      deploy: ${{ steps.resolve.outputs.deploy }}
    steps:
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail

          deploy=true
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            deploy=false
            environment=dev
            image_tag=pr-${{ github.event.pull_request.number }}-${GITHUB_SHA::7}
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            environment="${{ inputs.environment }}"
            image_tag=manual-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}
          elif [[ "${GITHUB_REF}" == refs/heads/develop ]]; then
            environment=dev
            image_tag=dev-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}
          elif [[ "${GITHUB_REF}" == refs/heads/staging ]]; then
            environment=staging
            image_tag=rc-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            environment=production
            image_tag="${GITHUB_REF_NAME}"
          else
            deploy=false
            environment=dev
            image_tag=ci-${GITHUB_SHA::7}
          fi

          echo "environment=${environment}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"

  validate:
    runs-on: ubuntu-latest
    needs: resolve-environment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build --if-present

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [resolve-environment, validate]
    if: needs.resolve-environment.outputs.deploy == 'true'
    environment: ${{ needs.resolve-environment.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Upload frontend to S3
        run: |
          set -euo pipefail
          aws s3 sync frontend/dist "s3://${{ vars.S3_BUCKET }}/" --delete

      - name: Invalidate CloudFront
        if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

      - name: Build and push backend image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.resolve-environment.outputs.image_tag }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${{ vars.ECR_REPOSITORY }}:${IMAGE_TAG}"
          docker build \
            --file backend/Dockerfile \
            --tag "$image" \
            backend
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Render ECS task definition
        id: task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ vars.ECS_TASK_DEFINITION }}
          container-name: ${{ vars.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.image }}

      - name: Run database migration
        if: vars.MIGRATION_TASK_DEFINITION != ''
        run: |
          set -euo pipefail
          aws ecs run-task \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --launch-type FARGATE \
            --task-definition "${{ vars.MIGRATION_TASK_DEFINITION }}" \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.ECS_SUBNETS }}],securityGroups=[${{ vars.ECS_SECURITY_GROUPS }}],assignPublicIp=DISABLED}"

      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deployment summary
        run: |
          {
            echo "### Deployment"
            echo "- Environment: ${{ needs.resolve-environment.outputs.environment }}"
            echo "- Image: ${{ steps.image.outputs.image }}"
            echo "- ECS cluster: ${{ vars.ECS_CLUSTER }}"
            echo "- ECS service: ${{ vars.ECS_SERVICE }}"
            echo "- S3 bucket: ${{ vars.S3_BUCKET }}"
          } >> "$GITHUB_STEP_SUMMARY"
