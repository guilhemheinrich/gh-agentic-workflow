# Extract the lockfile generated by the development stage.
# docker create + docker cp: no running container, so the entrypoint
# (migrations, seed) never executes.
DOCKER  := docker
COMPOSE := $(DOCKER) compose
APPS    := app-a app-b
PROJECT := $(notdir $(CURDIR))

lock: $(addprefix lock-,$(APPS))
	@echo "All lockfiles generated. Commit them."

lock-%:
	@$(COMPOSE) build $*
	@id=$$($(DOCKER) create $(PROJECT)-$*); \
	$(DOCKER) cp $$id:/app/bun.lock.docker ./apps/$*/bun.lock.docker; \
	$(DOCKER) rm $$id > /dev/null
	@echo "apps/$*/bun.lock.docker updated"
