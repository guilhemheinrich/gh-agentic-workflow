# Lab load balancer. Deliberate defects, each one a detection target:
#   round robin over two backends            -> header variation, pattern ABAB
#   ROUTEID cookie pins a client to a backend -> cookie affinity
#   Access-Control-Allow-Origin reflects the Origin, with credentials -> dangerous CORS
#   /server-status public                     -> exposed admin endpoint
#   TLS 1.0 and 1.1 accepted, self-signed short-lived certificate, no HSTS
#   ports 80 and 8080 serve plain HTTP with no redirect to HTTPS
upstream pool_rr { server backend-a:80; server backend-b:80; }
upstream pool_a  { server backend-a:80; }
upstream pool_b  { server backend-b:80; }

map $cookie_ROUTEID $pool {
  default pool_rr;
  a       pool_a;
  b       pool_b;
}

server {
  listen 80;
  listen 8080;
  listen 443 ssl;
  listen 8443 ssl;
  server_name lab-lb;

  ssl_certificate     /certs/lab.crt;
  ssl_certificate_key /certs/lab.key;
  ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
  ssl_ciphers "ALL:@SECLEVEL=0";

  add_header Via "1.1 lab-lb" always;
  add_header Access-Control-Allow-Origin $http_origin always;
  add_header Access-Control-Allow-Credentials true always;

  location = /server-status { stub_status; }

  location / {
    proxy_pass http://$pool;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}

# Control group: a correctly configured listener. The collectors must report it clean
# on protocols (TLS 1.2+ only), must parse its HSTS header and must see HTTP/2.
server {
  listen 9443 ssl;
  http2 on;
  server_name lab-lb;
  ssl_certificate     /certs/lab.crt;
  ssl_certificate_key /certs/lab.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  location / { return 200 "ok\n"; }
}
