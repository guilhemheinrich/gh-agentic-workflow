# FIXTURE, deliberately insecure: a wildcard ClusterRole bound to the `default`
# ServiceAccount of namespace `shop`. Any pod of that namespace that does not name a
# ServiceAccount is then cluster-admin in all but name.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shop-everything
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shop-everything
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shop-everything
subjects:
  - kind: ServiceAccount
    name: default
    namespace: shop
