# FIXTURE, deliberately insecure. Do not deploy. Each defect is a detection target for
# scan-iac.sh (trivy, kube-linter) and topology-from-manifests.py.
#
# Namespace `shop`: no NetworkPolicy at all (flat network), an Ingress without TLS,
# a privileged single-replica API on an unpinned image with a credential in plain env,
# a PostgreSQL published to the internet through a LoadBalancer Service.
# Namespace `payments`: the contrast case, hardened and isolated by a NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: shop
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: shop.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: shop
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.31.10-alpine
          env:
            - name: API_URL
              value: http://api.shop.svc.cluster.local:8080
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: shop
spec:
  selector:
    app: api
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: registry.example.test/shop/api:latest
          securityContext:
            privileged: true
          env:
            - name: DATABASE_URL
              value: postgres://shop:example-not-a-secret@postgres:5432/shop
            - name: REDIS_URL
              value: redis://cache:6379/0
            - name: PAYMENTS_URL
              value: http://ledger.payments.svc.cluster.local:8080
            - name: STRIPE_API_BASE
              value: https://api.stripe.com/v1
            - name: SMTP_HOST
              value: smtp.sendgrid.net
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: shop
spec:
  type: LoadBalancer
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: shop
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_PASSWORD
              value: example-not-a-secret
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: shop
spec:
  selector:
    app: cache
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-reports
  namespace: shop
spec:
  type: NodePort
  selector:
    app: reports
  ports:
    - port: 9000
      nodePort: 30900
