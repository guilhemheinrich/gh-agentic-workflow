# Lab backend B. Same application as A, different identity headers.
server {
  listen 80;
  add_header X-Served-By "app-b" always;
  add_header X-Backend-Server "10.42.0.12:8080" always;
  add_header X-Powered-By "Express" always;
  add_header Set-Cookie "ROUTEID=b; Path=/" always;

  location = /.git/HEAD { default_type text/plain; return 200 "ref: refs/heads/main\n"; }
  location = /metrics   { default_type text/plain; return 200 "# HELP http_requests_total Requests.\n# TYPE http_requests_total counter\nhttp_requests_total 17\n"; }
  location / { root /usr/share/nginx/html; index index.html; }
}
