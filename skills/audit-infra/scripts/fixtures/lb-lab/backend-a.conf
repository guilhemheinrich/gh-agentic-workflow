# Lab backend A. Leaks its identity and a private address, sets an unprotected
# affinity cookie, and serves Git metadata and Prometheus metrics to anyone.
server {
  listen 80;
  add_header X-Served-By "app-a" always;
  add_header X-Backend-Server "10.42.0.11:8080" always;
  add_header X-Powered-By "Express" always;
  add_header Set-Cookie "ROUTEID=a; Path=/" always;

  location = /.git/HEAD { default_type text/plain; return 200 "ref: refs/heads/main\n"; }
  location = /metrics   { default_type text/plain; return 200 "# HELP http_requests_total Requests.\n# TYPE http_requests_total counter\nhttp_requests_total 42\n"; }
  location / { root /usr/share/nginx/html; index index.html; }
}
